<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}ConstructPro{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS de ConstructPro -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <h1>ConstructPro</h1>

        <p>
            Sistema de gestión y control de proyectos de construcción civil
        </p>

    </header>


    <!-- MENÚ DE NAVEGACIÓN -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="{{ url_for('inicio') }}">

                ConstructPro

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-expanded="false"
                aria-label="Mostrar menú">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">


                    <!-- INICIO -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('inicio') }}">

                            Inicio

                        </a>

                    </li>


                    <!-- PRODUCTOS -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('productos') }}">

                            Productos

                        </a>

                    </li>


                    <!-- CLIENTES -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('clientes') }}">

                            Clientes

                        </a>

                    </li>


                    <!-- PROVEEDORES -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('proveedores') }}">

                            Proveedores

                        </a>

                    </li>


                    <!-- FACTURACIÓN -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('facturacion') }}">

                            Facturación

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO DE LAS PÁGINAS -->

    <main class="container">

        {% block content %}

        {% endblock %}

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <p>
            <strong>Desarrollado por Geovanni Correa</strong>
        </p>

        <p>
            Desarrollo de Aplicaciones Web
        </p>

        <p>
            2026
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript de ConstructPro -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
